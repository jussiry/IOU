<div class="tally-actions" aria-label="Actions">
  <button class="tally-action surface-box" type="button" data-action="send" aria-label="Record">
    <svg class="tally-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <use href="#icon-send" />
    </svg>
    <span class="tally-action-label">Record</span>
  </button>
  <button class="tally-action surface-box" type="button" data-action="request" aria-label="Request">
    <svg class="tally-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <use href="#icon-request" />
    </svg>
    <span class="tally-action-label">Request</span>
  </button>
</div>
