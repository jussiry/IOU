<div class="balance-actions" data-slot="iou-actions"></div>

<div class="balance-hero" aria-label="Total balance">
  <div class="hero-label">Current balance</div>
  <div class="hero-amount"><span class="hero-number" data-bind="net-balance"></span></div>
  <div class="hero-sub">
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div>
          Friends owe
          <small>to you</small>
        </div>
        <strong class="pos" data-bind="friends-owe-total"></strong>
      </div>
      <div class="sub-card" aria-label="Friends owe to you">
        <div class="inline-list" data-list="friends-owe"></div>
      </div>
    </button>
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div>
          You owe
          <small>to friends</small>
        </div>
        <strong class="neg" data-bind="you-owe-total"></strong>
      </div>
      <div class="sub-card" aria-label="You owe to friends">
        <div class="inline-list" data-list="you-owe"></div>
      </div>
    </button>
  </div>
</div>
<div class="balance-hero trust-hero" aria-label="Trust allowances">
  <div class="hero-label">Trust</div>
  <div class="hero-amount"><span class="hero-number" data-bind="available-credit"></span> <span>available credit</span></div>
  <div class="hero-sub">
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div><strong>Credit</strong> you are <strong>given</strong></div>
        <strong data-bind="credit-from-others"></strong>
      </div>
      <div class="sub-card" aria-label="Credit you are given">
        <div class="inline-list" data-list="credit-from-others"></div>
      </div>
    </button>
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div><strong>Credit</strong> you have <strong>extended</strong></div>
        <strong data-bind="credit-you-extend"></strong>
      </div>
      <div class="sub-card" aria-label="Credit you extend">
        <div class="inline-list" data-list="credit-you-extend"></div>
      </div>
    </button>
  </div>
</div>

<template data-template="credit-item">
  <div class="credit-item">
    <div data-bind="name"></div>
    <div class="amount" data-bind="amount"></div>
  </div>
</template>
