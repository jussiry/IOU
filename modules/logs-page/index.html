<div class="section">
  <h2 class="section-title">Logs</h2>
  <div class="log-list" data-list="logs"></div>
</div>

<template data-template="log-item">
  <div class="log-item">
    <span class="log-time" data-bind="time"></span>
    <span class="log-text" data-bind="text"></span>
  </div>
</template>
