<div class="iou-actions" aria-label="Actions">
  <button class="iou-action" type="button" data-action="send" aria-label="Send">
    <svg class="iou-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <use href="#icon-send" />
    </svg>
    <span class="iou-action-label">Send</span>
  </button>
  <button class="iou-action" type="button" data-action="receive" aria-label="Receive">
    <svg class="iou-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <use href="#icon-receive" />
    </svg>
    <span class="iou-action-label">Receive</span>
  </button>
</div>
