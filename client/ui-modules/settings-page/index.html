<div class="section">
  <h2>Settings</h2>
  <div class="settings-user surface-box">
    <div class="settings-field">
      <span class="settings-field-label">Name:</span>
      <span class="settings-field-value" data-bind="user-name" data-name-view></span>
      <form class="settings-name-form" data-name-edit hidden>
        <input class="settings-name-input" type="text" data-action="name-input" autocomplete="off" />
        <button class="settings-name-save" type="submit">Save</button>
        <button class="settings-name-cancel" type="button" data-action="cancel-edit-name">Cancel</button>
      </form>
    </div>
    <button class="settings-edit-name" type="button" data-action="edit-user-name" aria-label="Edit user name" data-name-edit-btn>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M4 20h4l10.5-10.5a1.4 1.4 0 0 0 0-2L16.5 5.5a1.4 1.4 0 0 0-2 0L4 16v4z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
  <button class="settings-big-button surface-box" type="button" data-action="transfer-user">
    <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M4 7h12m0 0-3-3m3 3-3 3M20 17H8m0 0 3 3m-3-3 3-3"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    Transfer to another device
  </button>
  <button class="settings-big-button settings-remove surface-box" type="button" data-action="remove-user">
    <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <use href="#icon-delete" />
    </svg>
    Remove user
  </button>
  <div class="settings-version" data-bind="app-version"></div>
</div>
