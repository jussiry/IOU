<div class="section">
  <h2 class="section-title">State</h2>
  <div class="state-list" data-list="state">
    <div class="state-item surface-box">
      <span class="state-label">Peer connections</span>
      <span class="state-value" data-bind="peer-connections">0</span>
    </div>
    <div class="state-item surface-box">
      <span class="state-label">Another devices online</span>
      <span class="state-value" data-bind="self-device-connections">0</span>
    </div>
  </div>
  <h2 class="section-title">Logs</h2>
  <div class="log-list" data-list="logs"></div>
</div>

<template data-template="log-item">
  <div class="log-item surface-box">
    <span class="log-time" data-bind="time"></span>
    <span class="log-text" data-bind="text"></span>
  </div>
</template>
