<section class="welcome-screen" data-section="welcome">
  <div class="welcome-card">
    <h1>Welcome to IOU</h1>
    <p class="welcome-copy">
      Money, in its essense, is just book keeping that tracks good deeds that should
      be paid back. IOU (I owe you) returns money to its roots by basing it on personal
      debts that can be extended to strangers through a trusted chain of friends.
    </p>

    <form class="welcome-form" data-form="welcome">
      <label class="welcome-label" for="welcome-name">Choose a name</label>
      <input
        id="welcome-name"
        class="welcome-input"
        type="text"
        autocomplete="nickname"
        maxlength="40"
        data-bind="welcome-name"
      />
      <p class="welcome-error" data-bind="welcome-error" hidden></p>
      <button class="welcome-create" type="submit" data-action="create-user">
        Create a user
      </button>
    </form>
  </div>
</section>
