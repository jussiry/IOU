<div class="balance-actions" data-slot="iou-actions"></div>

<div class="balance-hero" aria-label="Total balance">
  <div class="hero-label">Current balance</div>
  <div class="hero-amount"><span class="hero-number" data-bind="net-balance"></span></div>
  <div class="hero-sub">
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div class="pill-label">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#icon-iou" />
          </svg>
          <div class="pill-text">
            Friends owe
            <small>to you</small>
          </div>
        </div>
        <strong class="pos" data-bind="friends-owe-total"></strong>
      </div>
      <div class="sub-card" aria-label="Friends owe to you">
        <div class="inline-list" data-list="friends-owe"></div>
      </div>
    </button>
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div class="pill-label">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#icon-iou" />
          </svg>
          <div class="pill-text">
            You owe
            <small>to friends</small>
          </div>
        </div>
        <strong class="neg" data-bind="you-owe-total"></strong>
      </div>
      <div class="sub-card" aria-label="You owe to friends">
        <div class="inline-list" data-list="you-owe"></div>
      </div>
    </button>
  </div>
</div>
<div class="balance-hero trust-hero" aria-label="Trust agreements">
  <div class="hero-label">Trust agreements</div>
  <div class="hero-amount"><span class="hero-number" data-bind="available-trust"></span> <span>theoretical limit when sending IOU's to someone you don't know</span></div>
  <div class="hero-sub">
    <button class="pill toggle" type="button" aria-expanded="false">
      <div class="pill-row">
        <div class="pill-label">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#icon-trust" />
          </svg>
          <div class="pill-text"><strong>Trust</strong> agreements</div>
        </div>
        <strong data-bind="trust-agreements-total"></strong>
      </div>
      <div class="sub-card" aria-label="Trust agreements">
        <div class="inline-list" data-list="trust-agreements"></div>
      </div>
    </button>
  </div>
</div>

<template data-template="trust-item">
  <div class="trust-item">
    <div data-bind="name"></div>
    <div class="amount" data-bind="amount"></div>
  </div>
</template>
