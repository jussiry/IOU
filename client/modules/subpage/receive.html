<div class="send-content receive-content">
  <div class="balance-hero trust-hero send-card">
    <form class="send-form receive-form" aria-label="Receive IOU form">
      <label class="form-field form-field-inline">
        <span class="form-label">Amount (EUR)</span>
        <input
          class="form-input"
          type="number"
          inputmode="decimal"
          min="0"
          step="1"
          placeholder="0.00"
          data-bind="receive-amount"
        />
      </label>
      <label class="form-field">
        <span class="form-label"></span>
        <textarea
          class="form-textarea"
          rows="1"
          placeholder="Add a note"
          data-bind="receive-message"
        ></textarea>
      </label>
      <div class="receive-qr-display" data-bind="receive-qr"></div>
    </form>
  </div>
</div>
