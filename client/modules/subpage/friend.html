<div class="friend-content">
  <div class="actionable-box surface-box" data-section="friend-request-notification" hidden>
    <div class="actionable-box-label" data-bind="friend-request-label"></div>
    <div class="actionable-box-actions" data-section="friend-accept-actions" hidden>
      <button class="friend-inline-action friend-inline-action--primary surface-box" type="button" data-action="accept-friend">
        Accept
      </button>
      <button class="friend-inline-action surface-box" type="button" data-action="reject-friend">
        Reject
      </button>
    </div>
    <div class="actionable-box-actions" data-section="friend-remove-actions" hidden>
      <button class="friend-inline-action surface-box" type="button" data-action="remove-request">
        Remove request
      </button>
    </div>
  </div>
  <div class="actionable-box surface-box" data-section="trust-suggestion" hidden>
    <div class="actionable-box-label" data-bind="trust-suggestion-label"></div>
    <div class="actionable-box-actions" data-section="trust-suggestion-actions" hidden>
      <button class="friend-inline-action friend-inline-action--primary surface-box" type="button" data-action="agree-trust">
        Agree
      </button>
      <button class="friend-inline-action surface-box" type="button" data-action="disagree-trust">
        Disagree
      </button>
    </div>
    <div class="actionable-box-actions" data-section="trust-cancel-actions" hidden>
      <button class="friend-inline-action surface-box" type="button" data-action="cancel-trust">
        Cancel suggestion
      </button>
    </div>
    <div class="actionable-box-actions" data-section="trust-ok-actions" hidden>
      <button class="friend-inline-action friend-inline-action--primary surface-box" type="button" data-action="dismiss-trust">
        OK
      </button>
    </div>
  </div>
  <div class="friend-stats" aria-label="Debt and trust">
    <div class="friend-stat surface-box" data-section="friend-debt">
      <div class="friend-stat-label" data-bind="debt-label">owes you</div>
      <div class="friend-stat-value">
        <span class="friend-stat-amount" data-bind="debt-amount">+€0.00</span>
      </div>
    </div>
    <button class="friend-stat friend-stat--trust surface-box" type="button" data-section="trust-limit">
      <div class="friend-stat-label" data-bind="trust-title">Trust limit</div>
      <div class="friend-stat-value friend-stat-value--small">
        <span class="friend-stat-amount" data-bind="trust-amount">€0.00</span>
        <svg class="friend-stat-edit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="#icon-edit" />
        </svg>
      </div>
    </button>
  </div>
  <div class="balance-hero trust-hero friend-card" data-section="friend-body">
    <div class="hero-label" data-bind="friend-label">Transactions</div>
    <ul class="tx-list" data-list="friend-transactions"></ul>
  </div>
  <div data-section="trust-suggestion-explainer" data-slot="trust-explainer" hidden></div>
</div>

<template data-template="tx-item">
  <li>
    <span class="tx-date" data-bind="date"></span>
    <strong class="tx-amount" data-bind="amount"></strong>
    <span class="tx-note" data-bind="note"></span>
  </li>
</template>
