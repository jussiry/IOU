<div class="send-content">
  <div class="balance-hero trust-hero send-card">
    <form class="send-form add-friend-form" aria-label="Add a friend form">
      <label class="form-field">
        <span class="form-label">My key</span>
        <span class="add-friend-key-display">
          <input
            class="form-input add-friend-key-input add-friend-key-input--readonly"
            type="text"
            inputmode="text"
            readonly
            aria-readonly="true"
            data-bind="my-key"
          />
          <button
            class="add-friend-copy-button"
            type="button"
            data-action="copy-my-key"
            aria-label="Copy my key"
          >
            <svg class="add-friend-copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <use href="#icon-copy" />
            </svg>
          </button>
        </span>
      </label>
      <label class="form-field">
        <span class="form-label">Friends key</span>
        <input
          class="form-input add-friend-key-input"
          type="text"
          inputmode="text"
          autocapitalize="off"
          autocomplete="off"
          spellcheck="false"
          placeholder="npub1..."
          data-bind="friend-key"
        />
      </label>
      <p class="form-error" data-bind="friend-key-error" hidden>
        Add friends public key in correct format
      </p>
      <div class="form-field form-field-inline form-field-inline-full add-friend-toggle-row">
        <span class="form-label">Suggest trust agreement</span>
        <button
          class="check-toggle"
          type="button"
          data-bind="suggest-trust-toggle"
          aria-pressed="false"
          aria-label="Suggest trust limit"
        >
          <span class="check-toggle-track">
            <span class="check-toggle-thumb"></span>
          </span>
        </button>
      </div>
      <div class="add-friend-trust-panel" data-section="suggest-trust-panel" hidden>
        <div data-slot="trust-limit-field"></div>
      </div>
      <button class="primary-button" type="button" data-bind="add-friend-submit" aria-disabled="true">
        <svg class="primary-button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="#icon-plus" />
        </svg>
        Add friend
      </button>
    </form>
  </div>
  <div class="add-friend-trust-explainer" data-section="suggest-trust-explainer" hidden>
    <div data-slot="trust-explainer"></div>
  </div>
</div>
